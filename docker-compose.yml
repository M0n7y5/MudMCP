services:
  mudblazor-mcp:
    # `docker compose up` builds locally and tags the result with the GHCR name.
    # To run the published image instead: docker compose pull && docker compose up --no-build
    image: ghcr.io/m0n7y5/mudmcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mudblazor-mcp
    ports:
      # Host port 8000 matches the default local development URL. Update any
      # existing mcp.json / claude_desktop_config.json entries that use :5180.
      - "8000:8080"
    volumes:
      # Mount the whole data directory so per-version clones, index files, and
      # versions.json all persist across restarts.
      - mudblazor-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Add the MudBlazor version as an environment variable so it can be overridden at runtime
      - MUDBLAZOR_VERSION=9.0.0
      # Other supported overrides:
      # - MudBlazor__Repository__Url=https://github.com/MudBlazor/MudBlazor.git
      # - MudBlazor__Repository__DataPath=/app/data
      # - MudBlazor__Repository__MaxCachedVersions=5
    # Health checking is inherited from the image HEALTHCHECK (liveness probe on
    # /health/live with a 10-minute start period for the initial clone + index
    # build). Override the `healthcheck:` key here only to change those timings.
    restart: unless-stopped

volumes:
  mudblazor-data:
    driver: local
